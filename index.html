<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111f" />
    <meta name="description" content="Vic 的個人工作中控台：任務、Notion、新聞情報與語音筆記。" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Workbench" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/vic-workbench.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Vic Workbench</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((registration) => {
            const reloadForUpdate = () => {
              if (sessionStorage.getItem('sw-reloaded-for-update') === '1') return;
              sessionStorage.setItem('sw-reloaded-for-update', '1');
              window.location.reload();
            };

            const activateWaitingWorker = () => {
              if (registration.waiting) {
                registration.waiting.postMessage({ type: 'SKIP_WAITING' });
              }
            };

            registration.update().then(activateWaitingWorker).catch(() => {});

            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              if (!newWorker) return;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  newWorker.postMessage({ type: 'SKIP_WAITING' });
                }
              });
            });

            navigator.serviceWorker.addEventListener('controllerchange', reloadForUpdate);

            document.addEventListener('visibilitychange', () => {
              if (document.visibilityState === 'visible') {
                sessionStorage.removeItem('sw-reloaded-for-update');
                registration.update().then(activateWaitingWorker).catch(() => {});
              }
            });
          }).catch(() => {});
        });
      }
    </script>
  </body>
</html>
